name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Generated by Expo locally and gitignored; typecheck needs it.
      - run: echo '/// <reference types="expo/types" />' > expo-env.d.ts
      - run: npm test -- --ci
      - run: npm run typecheck
      - run: npm run lint
      # Production dependencies only (incl. Expo tooling): critical advisories fail the build.
      - name: Audit (shipped packages)
        run: npm audit --omit=dev --audit-level=critical
      # The CSP in vercel.json allows Expo's inline script by hash; fail if a build produces one it doesn't allow.
      - run: npm run build:web
        env:
          # Placeholders: this build is only checked, never deployed (Vercel builds with the real values).
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      - run: node scripts/check-csp.mjs
